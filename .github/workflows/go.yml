name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o bin/tbank ./cmd/tbank
      - run: ./bin/tbank scan -fixture testdata/carry.json > /tmp/carry-demo.json
      - run: ./bin/tbank curve-scan -fixture testdata/curves.json > /tmp/curve-demo.json
